# V0.4 (2026-10-18) REAR-WHEEL-DRIVE, independent left and right rear motors, no differential.
# Source tags: [VW]=VW ID.3 published reference; [TOYOTA/ORNL]=Toyota/Oak Ridge tested reference;
# [BREMBO]=Brembo rear disc catalogue; [DESIGN]=custom hypothetical system; [ASSUMED]=unverified.
# None of this is an actual VW ID.3 modification. Numeric values use SI except fields naming other units.
metadata:
  version: v0.4
  architecture: independent_twin_rear_motor_drives
  status: mixed_literature_references_and_conceptual_design_not_oem_vehicle
  study_scope: single_rear_side_motor_reducer_inboard_disc_thermal_model
  literature_reference: docs/REAR_DRIVE_V04_SOURCED_BASELINE.md
vehicle:
  reference_body: VW_ID3_class_reference_not_actual_modified_ID3
  mass_kg: 1800.0                    # [DESIGN]; VW early ID.3 minimum curb mass 1719kg
  wheelbase_m: 2.765                # [VW MY21 PDF p19 dimension L101] reference, not concept measurement
  cg_height_m: 0.55                 # [ASSUMED]
  static_rear_axle_fraction: 0.55   # [ASSUMED] NOT manufacturer measured
  rear_track_width_m: null         # obtain exact variant, wheel packaging
  tire_reference: 215_55_R18       # [VW ID.3 Pro 2023]
  tire_nominal_unloaded_radius_m: 0.34685 # derived from 215/55R18 nominal geometry
  wheel_effective_rolling_radius_m: 0.33  # [ASSUMED], actual measured rolling radius needed
  maximum_vehicle_speed_kmh_target: 160.0 # [VW] benchmark target, not proven by design
  drag_coefficient: 0.27            # [VW search-index reference only; origin URL 404] retain UNVERIFIED screening value
  frontal_area_m2: 2.30             # [ASSUMED]
  rolling_resistance_coefficient: 0.012 # [ASSUMED]
  rotational_inertia_factor: 1.0    # [ASSUMED] 1.0 = rotational inertias neglected
  gravity_m_s2: 9.81
  tire_road_mu: 0.80                # [ASSUMED], dry road demonstrator, not OEM
drive:
  driven_axle: rear
  independent_motor_count: 2
  differential_present: false
  rear_motor_per_side:
    hardware_reference: 2010_Toyota_Prius_MG2_ORNL_test_data_not_the_actual_installed_product
    motor_type: permanent_magnet_synchronous
    peak_mechanical_power_kw: 60.0       # [TOYOTA/ORNL]
    physical_peak_torque_nm: 207.0       # [TOYOTA/ORNL]
    max_mechanical_speed_rpm: 13500      # [ORNL]
    configured_traction_torque_limit_nm: 130.0 # [DESIGN] software cap, not motor nameplate
    configured_regen_torque_limit_nm: null    # derive from verified generator-mode map
    continuous_mechanical_power_kw: null     # not 60kW by default! 18s ORNL benchmark only
    torque_speed_map_file: null
    epa_emot_map_file: data/raw/m0/epa_mg2/7- emachine_2010_Toyota_Prius_60kW_650V_MG2_EMOT.m # [EPA] audited numeric grid, 650V; regen ESTIMATED
    ornl_motor_only_efficiency_map_file: data/raw/m0/epa_mg2/3c- 2010 Toyota Prius 60kW 650V MG2 EMOT - ORNL Test Data File.xlsx # sparse DRIVE-only motor/inverter sheets; not winding loss
    motor_inverter_efficiency_combined: true  # EPA EMOT means both motor+inverter, excludes gear
    motor_loss_map_file: null
    inverter_loss_map_file: null
    winding_temp_limit_c: null
    magnet_temp_limit_c: null
    coolant_inlet_temp_c: null
    coolant_mass_flow_kg_s: null
    stator_outer_diameter_m: 0.264     # [ORNL Table 2.7] reference lamination OD, NOT housing OD
    motor_housing_dimensions_m: null
  rear_gearbox_per_side:
    reduction_motor_to_wheel: 9.0       # [DESIGN], VW precedent approx 10 ratio not identical
    stages: 2                         # [DESIGN] tentative
    peak_drive_efficiency_screening: 0.96 # [ASSUMED], not loss map
    peak_backdrive_efficiency_screening: 0.96 # [ASSUMED], distinct from drive
    drive_loss_map_file: null
    backdrive_loss_map_file: null
    output_shaft_diameter_m: null
    gearbox_housing_dimensions_m: null
    gearbox_oil_mass_kg: null
    oil_temperature_limit_c: null
  aggregate_motor_peak_power_kw: 120.0 # 2 x 60
  total_battery_regen_acceptance_kw: null
  battery_soc: null
  battery_regen_limit_temperature_curve: null
  inverter_limit_each_kw: null
brakes:
  architecture: two_independent_inboard_friction_discs_at_rear_gearbox_outputs
  brake_detailed_model_scope: one_rear_disc
  rear_rotor_count: 2
  front_conventional_service_brakes_retained: true
  rotor_speed_to_own_wheel_speed_ratio: 1.0
  rear_rotor_per_side:
    geometric_reference: Brembo_09_9908_21_REAR_280x22_ventilated
    outside_diameter_m: 0.280         # [BREMBO]
    thickness_m: 0.022               # [BREMBO]
    disc_overall_height_m: 0.042     # [BREMBO], not guaranteed inboard pack-compatible
    nominal_center_bore_m: 0.068     # [BREMBO]
    inner_ring_diameter_m: null
    mass_kg: null
    effective_friction_radius_m: null
    mean_friction_coefficient_screening: 0.40 # [ASSUMED], temp dependence must be added
    pad_disc_heat_partition: null
    brake_torque_capacity_nm: null
    caliper_clamping_limit_N: null
    disc_to_gearbox_housing_min_clearance_m: null
    disc_to_heatshield_clearance_m: null
    disc_max_temperature_c: null
    caliper_max_temperature_c: null
    inboard_custom_mount_requires_new_strength_and_thermal_validation: true
  axle_brake_allocation: dynamic_axle_load_based_reference_not_commercial_EBD
  rear_regen_and_friction_priority: limited_by_rear_adhesion_and_battery_acceptance
thermal:
  ambient_temperature_c: 25.0
  cold_start_initial_temperature_c: 25.0
  initial_preheated_motor_temperature_c: null
  rotor_emissivity: null
  shield_emissivity: null
  contact_resistance_m2K_W: null
  gearbox_cooling_boundary: null
cases:
  nominal_stop_initial_speed_kmh: 100.0
  nominal_stop_deceleration_g: 0.6
  stop_deceleration_g_scan: [0.3, 0.6, 0.8]
  total_battery_regen_acceptance_kw_screening: [0, 30, 60] # total for both motors
  repeated_stop_count: null
  repeated_stop_interval_s: null
  high_load_preheat_trace_file: null
optimization:
  brake_to_shield_gap_m_bounds: [0.003, 0.010] # preliminary pending packaging
  shield_thickness_m_bounds: [0.0005, 0.002]
  guide_exit_angle_deg_bounds: [15, 60]
  guide_exit_area_ratio_bounds: [0.2, 0.8]
  no_claim_of_compatibility_without_cad_check: true
provenance:
  vw_body_source: https://www.volkswagen.ie/idhub/content/dam/onehub_pkw/importers/ie/models/product-guides/my23/ID3_MY23.pdf
  vw_gearbox_source: https://www.volkswagen-group.com/en/press-releases/in-brief-the-all-rounder-the-1-speed-gearbox-17030
  toyota_motor_source: https://global.toyota/en/detail/308252
  ornl_motor_test_report: https://info.ornl.gov/sites/publications/files/Pub26762.pdf
  vw_body_geometry_source: https://www.volkswagen-newsroom.com/en/the-new-id3-6240/technical-data-6249
  vw_wheelbase_source: https://www.volkswagen.ie/idhub/content/dam/onehub_pkw/importers/ie/models/product-guides/2021/my21_master/ID3_MY21.pdf
  epa_emot_map_catalogue: https://www.epa.gov/vehicle-and-fuel-emissions-testing/combining-data-complete-emotor-alpha-maps
  brembo_disc_source: https://www.bremboparts.com/europe/en/view-document/catalogue/disc/09-9908-21
  actual_test_or_oem_assembly: false
